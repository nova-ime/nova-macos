# Nova 的全局设置，随安装包放进 app 的共享数据目录（SharedSupport）。
# 底子是 rime-moran 的 default.yaml（GPL-3.0），方案列表只留 nova，切过的双拼/全拼重启后保留。
# 不要改这个文件：在 ~/Library/NovaSquirrel/default.custom.yaml 里用 patch 覆盖，升级时不会被冲掉。
# encoding: utf-8

config_version: '1.0.nova'

schema_list:
  - schema: nova

switcher:
  caption: 〔方案選單〕
  # Nova 只有一个方案，不露出方案选单；开关都在设置面板里（sources/NovaSettings.swift）。
  hotkeys: []
  save_options:
    - zrm
    - flypy
    - mspy
    - sogou
    - quanpin
    - quanpin_partial
    - fuzzy_zcs
    - fuzzy_nasal
    - fuzzy_nl
    - fuzzy_fh
    - fuzzy_rl
    - full_shape
    - ascii_punct
    - simplification
    - traditionalization
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
    - emoji
    - inflexible
    - unicode_comment
    - std_t
    - std_t2s
    - std_t2hk
    - std_t2tw
    - std_t2dzing
    - std_s
    - std_s2t
    - std_s2hk
    - std_s2tw
    - std_s2dzing
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/numbered_mode_switch
      # - key_bindings:/paging_with_comma_period

recognizer:
  patterns:
    email: "^([A-Za-z][-_.0-9A-Za-z]*|)@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
