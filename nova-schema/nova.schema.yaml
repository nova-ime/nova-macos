# Rime schema
# encoding: utf-8
#
# 自然码双拼整句输入。辅助码只认大写：niRE 是「你」，nire 是「ni re」两个音节。
# 词库和语法模型来自万象拼音（CC-BY-4.0，https://github.com/amzxyz/rime-wanxiang）：
# zrm-fuzhu 词库由 scripts/wanxiang/setup-wanxiang.sh 转成 `音节;辅助码` 编码的 nova_wx。
# 1898 句评测（.scratch/bench）里，整句正确率比墨奇词库＋八股文模型高约 15 个百分点。

schema:
  schema_id: nova
  name: Nova
  version: "1"
  description: 自然码双拼整句，大写字母输入两分辅助码。

switches:
  - name: ascii_mode
    states: [中文, 英文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [。，, ．，]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@*nova_tree_keys
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    # 日期时间（orq、osj、oxq）和自定义短语（用户目录下的 nova_phrases.txt）。
    - lua_translator@*nova_phrases
  filters:
    - lua_filter@*nova_sentences
    # 用 GPT-2 决定哪些块标橙、第一备选是什么，见 nova-lm/nova_lm.cc。插件或模型缺失时原样放行。
    - nova_lm_filter
    - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  # 大写不能开头：没有音节时按 Shift 打字母直接出英文。
  initials: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - derive/^(.+);(\w)(\w)$/$1\u$2/
    - derive/^(.+);(\w)(\w)$/$1\u$2\u$3/
    - derive/^(.+);(\w)(\w)$/$1/
    - erase/^(.+);(.+)$/

translator:
  dictionary: nova_wx
  prism: nova
  # 沿用换词库之前学到的词（编码格式相同，约 97% 的条目在新词库里能查到）。
  user_dict: moran
  contextual_suggestions: true
  max_homophones: 7
  spelling_hints: 0

key_binder:
  import_preset: default

# 用 symbols 而不是 default：多了 /fh、/sx 这类符号表（打 / 加字母），
# 用户在 symbols.custom.yaml 里对标点的改动也会生效。
punctuator:
  import_preset: symbols

# 不继承 default 的 uppercase 规则：它不锚定开头，会把音节后的大写字母切成英文段。
# 邮箱和网址整段原样上屏，不当拼音解码。网址只认 www. 和 http: 这类开头：
# default 里的「字母.字母」规则会把句号后面接着打的字也算进去。
recognizer:
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    uppercase: "^[A-Z][-_+.'0-9A-Za-z]*$"
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
    # 日期 orq、时间 osj、星期 oxq，见 lua/nova_phrases.lua。or、os、ox 在自然码里不是音节。
    date: "^o(rq|sj|xq)$"

# 语法模型：整句排序靠它。
# 参数照万象 README 推荐的设置。
grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 2
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -18

# 每个词的罚项，和 log 词频同一量纲。100 句测试里 20 最好（0 时会拆成很多单字）。
nova_sentences:
  word_penalty: 20

# 输入框里直接显示首选整句，不显示双拼。
style:
  inline_candidate: true
  # 在词和备选下面显示词频比例。改完要重新部署。
  show_share: false

nova_tree:
  enabled: true
  debug: false

# GPT-2 标橙插件（nova-lm/）。模型和字表由 scripts/install-nova.sh 复制到用户目录的 nova_lm/。
# tau：块的份额低于它就标橙。26 个领域评测里，0.075 时标橙块 90% 确实写错。
# repick：GPT-2 认为某块另一种写法份额更大、而现在这种写法的份额低于 repick_tau 时，直接换成那种写法
# （冻结的块和用户选过的块不换）。默认开，不多花时间（用的是标橙已经算好的分数）。逐键评测里整句全对
# 从 57.4% 升到 77.3%，但剩下的错很少再标橙：写错又没有橙色提示的句子从 9.9% 升到 20.0%。
# 想多看到橙色提示就改成 false。
nova_lm:
  enabled: true
  repick: true
  repick_tau: 0.2
  model: nova_lm/gpt2.gguf
  charmap: nova_lm/charmap.tsv
  tau: 0.075
  sentences: 5
  beam: 5
  threads: 4
  context: 30
