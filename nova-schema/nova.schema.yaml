# Rime schema
# encoding: utf-8
#
# 自然码双拼整句输入。辅助码用大写：niRE 是「你」，nire 是「ni re」两个音节。
# 也可以先按反引号再打小写：ni`re 和 niRE 一样（lua/nova_aux_keys.lua）。
# 词库和语法模型来自万象拼音（CC-BY-4.0，https://github.com/amzxyz/rime-wanxiang）：
# zrm-fuzhu 词库由 scripts/wanxiang/setup-wanxiang.sh 转成 `音节;辅助码` 编码的 nova_wx，外加一张简拼表 nova_wx_jp。
# 1898 句评测（.scratch/bench）里，整句正确率比墨奇词库＋八股文模型高约 15 个百分点。

schema:
  schema_id: nova
  name: Nova
  version: "1"
  description: 自然码双拼整句，大写字母输入两分辅助码。

switches:
  - name: ascii_mode
    states: [中文, 英文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [。，, ．，]
  # 输入方式。内部始终是自然码双拼：全拼和别家双拼都在 lua/nova_quanpin.lua 换成自然码，其余照双拼工作。
  - options: [zrm, flypy, mspy, sogou, quanpin]
    states: [自然码, 小鹤, 微软, 搜狗, 全拼]
  # 全拼模糊音（只在全拼开关打开时生效）。nova_quanpin.lua 给音节附上同字节长的变体码，
  # nova_sentences.lua 查询时合并；开关在设置面板里改，新用户默认开（NovaOptions）。
  - name: fuzzy_zcs
    states: [关, 开]
  - name: fuzzy_nasal
    states: [关, 开]
  - name: fuzzy_nl
    states: [关, 开]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    # 反引号加两个小写字母等于大写辅助码：ni`re 就是 niRE。
    - lua_processor@*nova_aux_keys
    - lua_processor@*nova_quanpin
    - lua_processor@*nova_tree_keys
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    # 日期时间（orq、osj、oxq）、符号表（ofh、osx）和自定义短语（用户目录下的 nova_phrases.txt）。
    - lua_translator@*nova_phrases
  filters:
    - lua_filter@*nova_sentences
    # 用 GPT-2 决定哪些块标橙、第一备选是什么，见 nova-lm/nova_lm.cc。插件或模型缺失时原样放行。
    - nova_lm_filter
    - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  # 大写不能开头：没有音节时按 Shift 打字母直接出英文。
  initials: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    # 全拼的简拼：只打声母的音节写成「声母键 + V」两个字符（nh 是 nVhV），位宽和别的音节一样。
    # 大写 V 不会和辅助码混：辅助码前面一定是两个小写字母。z/c/s 也能对到 zh/ch/sh（双拼里 zh/ch/sh 的声母键是 v/i/u）。
    # 只有全拼开关（nova_quanpin.lua）会打出这种编码。
    #
    # 简拼只查简拼表（nova_wx_jp，音节写成 ni~，不带辅助码，由 wx2nova.py 生成），不查主词典：
    # 主词典的音节带着辅助码，n 要展开成一千多个音节，连打几个简拼每键要上百毫秒；简拼表里只有二十来个。
    # 第 5 条让没缩写的音节也能对上简拼表，这样一个词里可以混着打（zhonggr 中国人）。
    # 这几条都用 abbrev：整串输入不含简拼时，librime 会丢掉所有 abbrev 得来的对应
    # （Syllabifier::BuildSyllableGraph），所以双拼模式下简拼表等于不存在，候选和造句都不受影响。
    - abbrev/^([a-z])[a-z]~$/$1V/
    - abbrev/^v[a-z]~$/zV/
    - abbrev/^i[a-z]~$/cV/
    - abbrev/^u[a-z]~$/sV/
    - abbrev/^([a-z][a-z])~$/$1/
    - erase/^[a-z][a-z]~$/
    - derive/^(.+);(\w)(\w)$/$1\u$2/
    - derive/^(.+);(\w)(\w)$/$1\u$2\u$3/
    - derive/^(.+);(\w)(\w)$/$1/
    - erase/^(.+);(.+)$/

translator:
  dictionary: nova_wx
  prism: nova
  user_dict: nova
  contextual_suggestions: true
  max_homophones: 7
  spelling_hints: 0
  # 全拼末尾没打完的音节靠它补全（muq 的 q 展开成 qi/qian…）。
  enable_completion: true

key_binder:
  import_preset: default

# 用 symbols 而不是 default：多了 /fh、/sx 这类符号表（打 / 加字母），
# 用户在 symbols.custom.yaml 里对标点的改动也会生效。
punctuator:
  import_preset: symbols

# 不继承 default 的 uppercase 规则：它不锚定开头，会把音节后的大写字母切成英文段。
# 邮箱和网址整段原样上屏，不当拼音解码。网址只认 www. 和 http: 这类开头：
# default 里的「字母.字母」规则会把句号后面接着打的字也算进去。
recognizer:
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    uppercase: "^[A-Z][-_+.'0-9A-Za-z]*$"
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
    # 日期 orq、时间 osj、星期 oxq，见 lua/nova_phrases.lua。or、os、ox 在自然码里不是音节。
    date: "^o(rq|sj|xq)$"


# 每个词的罚项，和 log 词频同一量纲。100 句测试里 20 最好（0 时会拆成很多单字）。
nova_sentences:
  word_penalty: 20

# 输入框里只留一个全角空格占位：按键和整句都在面板里，面板只有字母行和词块行两层。
style:
  inline_candidate: false
  # 在词和备选下面显示词频比例。改完要重新部署。
  show_share: false

nova_tree:
  enabled: true
  debug: false

# GPT-2 标橙插件（nova-lm/）。模型和字表由 scripts/install-nova.sh 复制到用户目录的 nova_lm/。
# tau：块的份额低于它就标橙。26 个领域评测里，0.075 时标橙块 90% 确实写错。
# repick：GPT-2 认为某块另一种写法份额更大、而现在这种写法的份额低于 repick_tau 时，直接换成那种写法
# （冻结的块和用户选过的块不换）。默认开，不多花时间（用的是标橙已经算好的分数）。逐键评测里整句全对
# 从 57.4% 升到 77.3%，但剩下的错很少再标橙：写错又没有橙色提示的句子从 9.9% 升到 20.0%。
# 想多看到橙色提示就改成 false。
nova_lm:
  enabled: true
  repick: true
  repick_tau: 0.2
  model: nova_lm/gpt2.gguf
  charmap: nova_lm/charmap.tsv
  # 多音字每个读音的占比。占比不到文件首行 rare_share 的是冷僻读音（从 zòng、能 nài），重选不换成它们；
  # 其余读音按 reading_weight × ln(占比) 加进 GPT-2 的句子分，见 nova_lm.cc 的 score()。
  # 6486 句全集：reading_weight 0 → 0.5，整句全对 5042 → 5057（改好 31、改坏 16）。
  rare: nova_rare.txt
  reading_weight: 0.5
  tau: 0.075
  sentences: 5
  # GPT-2 按码逐字 beam 的宽度，也是 beam 拿去打分的整句数。5 → 20：6486 句逐键评测整句全对
  # 80.5% → 82.2%（改好 150、改坏 43），标橙块确实写错的比例 80% → 88%，每键耗时不变。
  # 40 时前缀树接近 2048 个节点的上限，满了就清空重算。
  beam: 20
  threads: 4
  context: 30
  # 人名、地名合成一个词块，只改分块不改字，见 nova-lm/README.md。模型里没有标注头时自动不做。
  # 6486 句逐键评测：人名整个成一块 57.2% → 70.3%，整句全对 5328 → 5329；每键平均多 0.57 ms。
  entity: true
